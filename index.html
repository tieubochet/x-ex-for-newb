<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X Gemini Translator Settings</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
      }
      body {
        min-width: 400px;
        min-height: 200px;
        margin: 0;
        background-color: #111827; /* Equivalent to Tailwind's bg-gray-900 */
        color: #d1d5db; /* Equivalent to Tailwind's text-gray-300 */
      }
      .container-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .card {
        width: 100%;
        max-width: 28rem; /* max-w-md */
        padding: 2rem; /* p-8 */
        background-color: #1f2937; /* bg-gray-800 */
        border-radius: 0.5rem; /* rounded-lg */
        box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1); /* shadow-lg */
        text-align: center;
      }
      .card-content > div:not(:first-child) {
         margin-top: 1.5rem; /* space-y-6 */
      }
      h1 {
        margin: 0;
        font-size: 1.875rem; /* text-3xl */
        line-height: 2.25rem;
        font-weight: 700; /* font-bold */
        color: #ffffff; /* text-white */
      }
      p {
        margin: 0;
      }
      .subtitle {
        margin-top: 0.5rem; /* mt-2 */
        color: #9ca3af; /* text-gray-400 */
      }
      .info-section {
        padding-top: 1rem; /* pt-4 */
      }
      .info-text-main {
         color: #d1d5db; /* text-gray-300 */
      }
      .info-text-sub {
        margin-top: 0.5rem; /* mt-2 */
        font-size: 0.75rem; /* text-xs */
        line-height: 1rem;
        color: #6b7280; /* text-gray-500 */
      }
    </style>
  </head>
  <body>
    <div class="container-wrapper">
      <div class="card">
        <div class="card-content">
            <div>
                <h1>X Gemini Translator</h1>
                <p class="subtitle">Settings</p>
            </div>
            
            <div class="info-section">
              <p class="info-text-main">
                This extension is active and ready to translate.
              </p>
              <p class="info-text-sub">
                The API key is managed by the application's configuration and does not need to be set here.
              </p>
            </div>
        </div>
      </div>
    </div>
  </body>
</html>
